name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run rollup && npm run add-version

      - name: Verify output
        run: test -f dist/dreame-vacuum-card.js

      - name: Package zip release (archive chunkée complète)
        # dist/ contient désormais le bundle principal + les chunks lottie chargés à
        # la demande (voir plan 013) : cette archive complète permet une installation
        # manuelle "tout le dossier". Exécuté après add-version pour ne pas figer le
        # placeholder, et avant tout .zip pour ne jamais s'auto-inclure dans l'archive.
        run: cd dist && zip -r dreame-vacuum-card.zip . -x '*.zip'

      - name: Build single-file (asset HACS)
        # hacs.json (filename: dreame-vacuum-card.js) pointe sur un fichier UNIQUE :
        # HACS ne télécharge que cet asset de release, donc il doit être autonome
        # (dynamic imports inlinés, y compris le moteur Lottie) plutôt que le bundle
        # chunké de dist/, dont les chunks manqueraient à l'appel.
        run: SINGLE_FILE=1 npx rollup -c

      - name: Add version to single-file build
        run: node scripts/add-version.mjs dist-release/dreame-vacuum-card.js

      - name: Verify single-file output
        run: test -f dist-release/dreame-vacuum-card.js

      - name: Create release
        # hacs.json pointe sur le .js single-file ; le zip chunké est publié en
        # parallèle — le jour où une release avec zip existe, hacs.json pourra
        # basculer en zip_release (filename: dreame-vacuum-card.zip) pour livrer les
        # chunks aux utilisateurs HACS, et la validation HACS restera verte.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: |
            dist-release/dreame-vacuum-card.js
            dist/dreame-vacuum-card.zip
          generate_release_notes: true
