name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run rollup && npm run add-version

      - name: Verify output
        run: test -f dist/dreame-vacuum-card.js

      - name: Package zip release (HACS zip_release)
        # dist/ contient désormais le bundle principal + les chunks lottie chargés à
        # la demande (voir plan 013) : HACS doit récupérer tout le répertoire, pas un
        # fichier unique. Exécuté après add-version pour ne pas figer le placeholder,
        # et avant tout .zip pour ne jamais s'auto-inclure dans l'archive.
        run: cd dist && zip -r dreame-vacuum-card.zip . -x '*.zip'

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: dist/dreame-vacuum-card.zip
          generate_release_notes: true
